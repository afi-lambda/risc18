[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "risc18"
version = "0.1.0"
description = "18-bit pipelined RISC for the Lattice ECP5 (Colorlight 5A-75B)"
requires-python = ">=3.10"
dependencies = ["amaranth>=0.5,<0.6", "pytest"]

[tool.setuptools]
packages = ["risc18"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
